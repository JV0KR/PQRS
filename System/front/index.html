<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .title{
            text-align:center;
            margin-bottom:25px;
        }

        .title h1{
            color:#2c3e50;
            font-size:28px;
        }

        .title p{
            color:gray;
            margin-top:5px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#34495e;
            font-weight:bold;
        }

        textarea{
            width:100%;
            height:140px;
            border:1px solid #dcdde1;
            border-radius:10px;
            padding:15px;
            resize:none;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        textarea:focus{
            border-color:#3498db;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#3498db;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2980b9;
        }

        .mensaje{
            margin-top:20px;
            padding:12px;
            border-radius:8px;
            text-align:center;
            display:none;
        }

        .success{
            background:#d4edda;
            color:#155724;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
        }

    </style>

</head>
<body>

    <div class="container">

        <div class="title">
            <h1>PQRS</h1>
            <p>Registro de Peticiones, Quejas y Reclamos</p>
        </div>

        <form id="pqrsForm">

            <div class="form-group">
                <label>Comentarios</label>

                <textarea 
                    id="comentarios"
                    placeholder="Escriba aquí su solicitud..."
                    required>
                </textarea>
            </div>

            <button type="submit">
                Registrar PQRS
            </button>

        </form>

        <div id="mensaje" class="mensaje"></div>

    </div>

    <script>

        const form = document.getElementById("pqrsForm");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const comentarios = document
                .getElementById("comentarios")
                .value;

            const mensaje = document.getElementById("mensaje");

            try {

                const response = await fetch(
                    "http://localhost:8080/api/pqrs",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            comentarios: comentarios
                        })
                    }
                );

                if(response.ok){

                    const data = await response.json();

                    mensaje.style.display = "block";
                    mensaje.className = "mensaje success";

                    mensaje.innerHTML = `
                        PQRS registrada correctamente <br><br>
                        <strong>Radicado:</strong> ${data.numeroRadicado}
                    `;

                    form.reset();

                }else{

                    mensaje.style.display = "block";
                    mensaje.className = "mensaje error";
                    mensaje.innerHTML = "Error al registrar la PQRS";

                }

            } catch(error){

                mensaje.style.display = "block";
                mensaje.className = "mensaje error";
                mensaje.innerHTML = "No se pudo conectar con el servidor";

                console.log(error);
            }

        });

    </script>

</body>
</html>
