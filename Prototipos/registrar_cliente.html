<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Cliente – PQRS</title>
<style>
*{box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:0;}
header{background:#1f4e79;color:white;padding:15px;text-align:center;}
header p{margin:4px 0 0;font-size:13px;opacity:0.8;}
.container{width:90%;max-width:560px;margin:30px auto;background:white;padding:24px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.back{margin-bottom:16px;} .back a{color:#1f4e79;font-size:13px;text-decoration:none;}
.back a:hover{text-decoration:underline;}
label{display:block;margin-top:12px;font-weight:bold;font-size:14px;color:#333;}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;font-size:14px;}
.row{display:flex;gap:10px;} .row>*{flex:1;}
button{background:#1f4e79;color:white;border:none;padding:11px 20px;border-radius:5px;cursor:pointer;font-size:14px;width:100%;margin-top:16px;}
button:hover{background:#163b5c;}
.alert{padding:11px;border-radius:5px;margin:12px 0;font-size:13px;}
.alert.success{background:#d1e7dd;color:#0f5132;border:1px solid #badbcc;}
.alert.error{background:#f8d7da;color:#842029;border:1px solid #f5c2c7;}
.note{font-size:12px;color:#888;margin-top:4px;}
</style>
</head>
<body>
<header>
  <h1>Registrar Cliente</h1>
  <p>Crea tu cuenta para consultar el estado de tus PQRS</p>
</header>

<div class="container">
  <div class="back"><a href="login_cliente.html">← Volver al login</a></div>

  <div class="alert error" id="err" style="display:none"></div>
  <div class="alert success" id="ok" style="display:none"></div>

  <div class="row">
    <div>
      <label>Tipo de identificación</label>
      <select id="tipo_id">
        <option value="">Seleccione</option>
        <option>CC</option>
        <option>TI</option>
        <option>CE</option>
      </select>
    </div>
    <div>
      <label>Número de identificación</label>
      <input type="text" id="num_id" placeholder="Ej: 1020304050">
    </div>
  </div>

  <label>Nombre completo</label>
  <input type="text" id="nombre" placeholder="Ej: Juan Pérez García">

  <label>Correo electrónico</label>
  <input type="email" id="email" placeholder="correo@ejemplo.com">
  <p class="note">Se enviará confirmación a este correo.</p>

  <label>Teléfono</label>
  <input type="tel" id="tel" placeholder="Ej: 3001234567">

  <label>Contraseña</label>
  <input type="password" id="pwd1" placeholder="Mínimo 6 caracteres">

  <label>Confirmar contraseña</label>
  <input type="password" id="pwd2" placeholder="Repite la contraseña">

  <button onclick="registrar()">Crear cuenta</button>
</div>

<script>
function registrar(){
  const campos={tipo_id:'Tipo de identificación',num_id:'Número de identificación',nombre:'Nombre completo',email:'Correo',tel:'Teléfono',pwd1:'Contraseña',pwd2:'Confirmar contraseña'};
  for(const[id,label]of Object.entries(campos)){
    if(!document.getElementById(id).value.trim()){
      mostrarError('El campo "'+label+'" es requerido.');return;
    }
  }
  if(document.getElementById('pwd1').value!==document.getElementById('pwd2').value){
    mostrarError('Las contraseñas no coinciden.');return;
  }
  document.getElementById('err').style.display='none';
  document.getElementById('ok').style.display='block';
  document.getElementById('ok').textContent='✔ Cuenta creada exitosamente. Serás redirigido al login…';
  setTimeout(()=>window.location='login_cliente.html',2000);
}
function mostrarError(msg){
  const el=document.getElementById('err');
  el.textContent=msg;el.style.display='block';
}
</script>
</body>
</html>
