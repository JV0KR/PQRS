<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reportes – PQRS</title>
<style>
*{box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:0;}
header{background:#1f4e79;color:white;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;}
header h1{margin:0;font-size:20px;}
header span{font-size:13px;opacity:0.85;}
.nav-bar{background:#163b5c;display:flex;gap:4px;padding:8px 20px;}
.nav-bar a{color:rgba(255,255,255,0.8);text-decoration:none;padding:7px 14px;border-radius:4px;font-size:13px;}
.nav-bar a:hover,.nav-bar a.active{background:rgba(255,255,255,0.15);color:white;}
.container{width:90%;max-width:820px;margin:24px auto;}
.panel{background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:18px;}
.panel h3{margin:0 0 16px;color:#1f4e79;font-size:16px;border-bottom:1px solid #eee;padding-bottom:10px;}
label{display:block;font-weight:bold;font-size:12px;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px;margin-top:12px;}
select,input{width:100%;padding:9px;border:1px solid #ccc;border-radius:5px;font-size:13px;}
.row{display:flex;gap:12px;} .row>div{flex:1;}
button{background:#1f4e79;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:13px;margin-top:14px;}
button:hover{background:#163b5c;}
button:disabled{background:#aaa;cursor:not-allowed;}
button.secondary{background:#6c757d;margin-left:8px;} button.secondary:hover{background:#545b62;}
/* Estadísticas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:#f8f9fa;border-radius:8px;padding:12px;text-align:center;border-left:3px solid #1f4e79;}
.stat.nuevo{border-color:#0d6efd;} .stat.proceso{border-color:#fd7e14;}
.stat.resuelto{border-color:#198754;} .stat.rechazado{border-color:#dc3545;}
.stat .n{font-size:22px;font-weight:bold;color:#1f4e79;}
.stat.nuevo .n{color:#0d6efd;} .stat.proceso .n{color:#fd7e14;}
.stat.resuelto .n{color:#198754;} .stat.rechazado .n{color:#dc3545;}
.stat .l{font-size:12px;color:#666;margin-top:3px;}
/* Tabla vista previa - RF-007: sin columna de enlace de anexo */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f0f4f8;color:#444;padding:9px 10px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:0.4px;}
td{padding:9px 10px;border-bottom:1px solid #f0f0f0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tr:hover td{background:#f8f9fa;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold;}
.badge.nuevo{background:#cfe2ff;color:#084298;}
.badge.proceso{background:#fff3cd;color:#664d03;}
.badge.resuelto{background:#d1e7dd;color:#0f5132;}
.badge.rechazado{background:#f8d7da;color:#842029;}
.alert-ok{background:#d1e7dd;color:#0f5132;border:1px solid #badbcc;padding:10px 14px;border-radius:5px;font-size:13px;display:none;margin-top:12px;}
.no-data{text-align:center;color:#888;padding:20px;font-size:13px;}
/* Encabezado del reporte simulado RF-007 */
.reporte-header{background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px;padding:12px 16px;margin-bottom:10px;font-size:13px;}
.reporte-header strong{color:#1f4e79;}
</style>
</head>
<body>
<header>
  <h1>Generación de Reportes</h1>
  <span>👤 gestor01 &nbsp;|&nbsp; <a href="login_gestor.html" style="color:white">Cerrar sesión</a></span>
</header>
<div class="nav-bar">
  <a href="dashboard.html">Dashboard</a>
  <a href="gestion_radicados.html">Gestión Radicados</a>
  <a href="reportes.html" class="active">Reportes</a>
</div>

<div class="container">
  <!-- Filtros RF-007: mismo filtro de RF-005 -->
  <div class="panel">
    <h3>Configurar reporte</h3>
    <div class="row">
      <div>
        <label>Tipo de PQRS</label>
        <select id="fil-tipo" onchange="actualizar()">
          <option value="">Todos</option>
          <option>Petición</option><option>Queja</option>
          <option>Reclamo</option><option>Sugerencia</option>
        </select>
      </div>
      <div>
        <label>Estado</label>
        <select id="fil-estado" onchange="actualizar()">
          <option value="">Todos</option>
          <option>Nuevo</option><option>En proceso</option>
          <option>Resuelto</option><option>Rechazado</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Fecha desde</label>
        <input type="date" id="f-desde" onchange="actualizar()">
      </div>
      <div>
        <label>Fecha hasta</label>
        <input type="date" id="f-hasta" onchange="actualizar()">
      </div>
    </div>
    <div>
      <!-- RF-007 E1: botón deshabilitado si no hay registros -->
      <button id="btn-pdf" onclick="exportarPDF()" disabled>⬇ Generar Reporte PDF</button>
      <button class="secondary" onclick="limpiar()">Limpiar filtros</button>
    </div>
    <div class="alert-ok" id="ok-export"></div>
  </div>

  <!-- Resumen estadístico -->
  <div class="panel">
    <h3>Resumen del resultado</h3>
    <div class="stats" id="stats"></div>
  </div>

  <!-- Vista previa RF-007: columnas sin "Enlace anexo" -->
  <div class="panel">
    <h3>Vista previa – <span id="count-lbl">0 registros</span></h3>
    <div class="reporte-header" id="reporte-header" style="display:none">
      <strong>Reporte de PQRS — SuperMarket</strong><br>
      <span id="rh-fecha"></span><br>
      <span id="rh-filtros"></span>
    </div>
    <div id="tabla-preview"></div>
  </div>
</div>

<script>
// Todos los radicados del sistema (RF-007: incluye todos, no solo página actual)
const todos=[
  {id:'PQRS-2026-00006',tipo:'Petición',estado:'Nuevo',fecha:'2026-05-27',cliente:'Laura Morales',
   comentarios:'Solicita información sobre política de devoluciones.',just:'-'},
  {id:'PQRS-2026-00005',tipo:'Queja',estado:'Nuevo',fecha:'2026-05-26',cliente:'Carlos Ruiz',
   comentarios:'Mala atención en caja el día 25/05.',just:'-'},
  {id:'PQRS-2026-00004',tipo:'Reclamo',estado:'En proceso',fecha:'2026-05-25',cliente:'Ana Torres',
   comentarios:'Cobro duplicado en factura #8812.',just:'Revisando con área de cartera.'},
  {id:'PQRS-2026-00003',tipo:'Sugerencia',estado:'Resuelto',fecha:'2026-05-22',cliente:'Pedro Gómez',
   comentarios:'Ampliar horario domingos hasta 8pm.',just:'Escalada a gerencia para próximo trimestre.'},
  {id:'PQRS-2026-00002',tipo:'Reclamo',estado:'Resuelto',fecha:'2026-05-10',cliente:'María López',
   comentarios:'Producto defectuoso recibido en mal estado.',just:'Se procesó reemplazo del producto.'},
  {id:'PQRS-2026-00001',tipo:'Petición',estado:'En proceso',fecha:'2026-05-19',cliente:'Juan Pérez',
   comentarios:'Información sobre pedido #4521.',just:'Revisando con soporte logístico.'},
];
const badgeCls={Nuevo:'nuevo','En proceso':'proceso',Resuelto:'resuelto',Rechazado:'rechazado'};

function actualizar(){
  const t=document.getElementById('fil-tipo').value;
  const e=document.getElementById('fil-estado').value;
  const fd=document.getElementById('f-desde').value;
  const fh=document.getElementById('f-hasta').value;

  const res=todos.filter(r=>
    (!t||r.tipo===t)&&(!e||r.estado===e)
    &&(!fd||r.fecha>=fd)&&(!fh||r.fecha<=fh)
  );

  // Estadísticas
  const cnt={Nuevo:0,'En proceso':0,Resuelto:0,Rechazado:0};
  res.forEach(r=>cnt[r.estado]++);
  document.getElementById('stats').innerHTML=
    [['Nuevo','nuevo'],['En proceso','proceso'],['Resuelto','resuelto'],['Rechazado','rechazado']]
    .map(([k,cls])=>`<div class="stat ${cls}"><div class="n">${cnt[k]}</div><div class="l">${k}</div></div>`).join('')
    +`<div class="stat"><div class="n" style="color:#333">${res.length}</div><div class="l">Total</div></div>`;

  // RF-007 E1: botón deshabilitado si no hay registros
  document.getElementById('btn-pdf').disabled=res.length===0;
  document.getElementById('count-lbl').textContent=res.length+' registro(s)';

  // Encabezado del reporte (RF-007)
  if(res.length){
    const now=new Date();
    const filtrosApl=[];
    if(t) filtrosApl.push('Tipo: '+t);
    if(e) filtrosApl.push('Estado: '+e);
    if(fd) filtrosApl.push('Desde: '+fd.split('-').reverse().join('/'));
    if(fh) filtrosApl.push('Hasta: '+fh.split('-').reverse().join('/'));
    document.getElementById('rh-fecha').textContent=
      'Generado: '+now.toLocaleDateString('es-CO')+' '+now.toLocaleTimeString('es-CO');
    document.getElementById('rh-filtros').textContent=
      'Filtros aplicados: '+(filtrosApl.length?filtrosApl.join(' | '):'Ninguno (todos los registros)');
    document.getElementById('reporte-header').style.display='block';
  } else {
    document.getElementById('reporte-header').style.display='none';
  }

  // Tabla vista previa RF-007: columnas = número, fecha, cliente, tipo, comentarios, estado, justificación
  // (sin columna de enlace de anexo — RN-002)
  if(!res.length){
    document.getElementById('tabla-preview').innerHTML=
      '<div class="no-data">No hay registros con los filtros aplicados. El botón de exportar está deshabilitado.</div>';
    return;
  }
  document.getElementById('tabla-preview').innerHTML=`
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Nº Radicado</th>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Tipo</th>
          <th>Comentarios</th>
          <th>Estado</th>
          <th>Justificación</th>
        </tr>
      </thead>
      <tbody>
        ${res.map(r=>`<tr>
          <td>${r.id}</td>
          <td>${r.fecha.split('-').reverse().join('/')}</td>
          <td>${r.cliente}</td>
          <td>${r.tipo}</td>
          <td title="${r.comentarios}">${r.comentarios}</td>
          <td><span class="badge ${badgeCls[r.estado]}">${r.estado}</span></td>
          <td title="${r.just}">${r.just}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
}

function exportarPDF(){
  const ok=document.getElementById('ok-export');
  ok.textContent='✔ Reporte PDF generado exitosamente. Descarga iniciada. (Evento registrado en log de auditoría)';
  ok.style.display='block';
  setTimeout(()=>ok.style.display='none',4000);
}

function limpiar(){
  ['fil-tipo','fil-estado','f-desde','f-hasta'].forEach(id=>document.getElementById(id).value='');
  actualizar();
}

actualizar();
</script>
</body>
</html>
