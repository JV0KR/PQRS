
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radicar PQRS</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:0;
}
header{
    background:#1f4e79;
    color:white;
    padding:15px;
    text-align:center;
}
.container{
    width:90%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#163b5c;
}
.card{
    border:1px solid #ddd;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}
.estado{
    font-weight:bold;
}
.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
</style>
</head>
<body>
<header><h1>Registrar PQRS</h1></header>

<div class="container">

<label>Tipo de identificación</label>
<select>
<option>CC</option>
<option>TI</option>
<option>CE</option>
</select>

<label>Número identificación</label>
<input type="text">

<label>Nombre completo</label>
<input type="text">

<label>Correo electrónico</label>
<input type="email">

<label>Teléfono</label>
<input type="text">

<label>Tipo PQRS</label>
<select>
<option>Petición</option>
<option>Queja</option>
<option>Reclamo</option>
<option>Sugerencia</option>
</select>

<label>Comentarios</label>
<textarea rows="5"></textarea>

<label>Adjuntar PDF</label>
<input type="file">

<button onclick="alert('PQRS registrada correctamente')">Radicar PQRS</button>

</div>
</body>
</html>
