<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Radicados – PQRS</title>
<style>
*{box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:0;}
header{background:#1f4e79;color:white;padding:15px;display:flex;align-items:center;justify-content:space-between;}
header h1{margin:0;font-size:20px;}
header span{font-size:13px;opacity:0.85;}
.container{width:90%;max-width:700px;margin:30px auto;background:white;padding:24px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.back{margin-bottom:16px;} .back a{color:#1f4e79;font-size:13px;text-decoration:none;}
.back a:hover{text-decoration:underline;}
label{display:block;font-weight:bold;font-size:13px;color:#555;margin-bottom:4px;}
input{width:100%;padding:9px;border:1px solid #ccc;border-radius:5px;font-size:14px;margin-bottom:4px;}
.filtro-bar{background:#f8f9fa;border:1px solid #e9ecef;border-radius:8px;padding:14px;margin-bottom:20px;}
.filtro-bar p{margin:0 0 8px;font-size:13px;color:#555;}
button{background:#1f4e79;color:white;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:13px;}
button:hover{background:#163b5c;}
button.sm{padding:6px 12px;font-size:12px;}
/* Cards */
.card{border:1px solid #e0e0e0;padding:16px;margin:12px 0;border-radius:8px;background:#fafafa;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.card h3{margin:0;font-size:16px;color:#1f4e79;}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;}
.badge.nuevo{background:#cfe2ff;color:#084298;}
.badge.proceso{background:#fff3cd;color:#664d03;}
.badge.resuelto{background:#d1e7dd;color:#0f5132;}
.badge.rechazado{background:#f8d7da;color:#842029;}
.card-meta{font-size:13px;color:#666;margin:4px 0;}
.card-detalle{margin-top:10px;padding-top:10px;border-top:1px solid #eee;}
.card-detalle p{font-size:13px;color:#444;margin:4px 0;}
.card-detalle .just{background:#f0f8ff;border-left:3px solid #1f4e79;padding:8px 12px;font-size:13px;color:#333;border-radius:0 4px 4px 0;margin-top:6px;}
.no-results{text-align:center;color:#888;padding:40px 20px;font-size:14px;}
.nav-bar{display:flex;gap:8px;margin-bottom:20px;}
</style>
</head>
<body>
<header>
  <h1>Mis Radicados</h1>
  <span>👤 Juan Pérez &nbsp;|&nbsp; <a href="login_cliente.html" style="color:white">Cerrar sesión</a></span>
</header>
<div class="container">

  <!-- Menú principal cliente (RF-002 salida: Mis Radicados + Nueva PQRS) -->
  <div class="nav-bar">
    <a href="mis_radicados.html"><button>📋 Mis Radicados</button></a>
    <a href="radicar_pqrs.html"><button style="background:#198754">+ Nueva PQRS</button></a>
  </div>

  <!-- RF-003: Filtro por número de radicado (solo este campo según los RF) -->
  <div class="filtro-bar">
    <p>Buscar radicado</p>
    <label>Número de radicado (búsqueda parcial)</label>
    <input type="text" id="buscar" placeholder="Ej: PQRS-2026 o 001" oninput="filtrar()">
  </div>

  <div id="lista-radicados"></div>
</div>

<script>
// Datos ordenados por fecha descendente (RF-003 RN-002)
const radicados=[
  {
    id:'PQRS-2026-00003',tipo:'Queja',estado:'Nuevo',fecha:'25/05/2026',
    comentarios:'Demora en la entrega del pedido #7745. Han pasado 5 días desde la fecha prometida.',
    justificacion:null,
    tieneAnexo:false
  },
  {
    id:'PQRS-2026-00001',tipo:'Petición',estado:'En proceso',fecha:'19/05/2026',
    comentarios:'Necesito información sobre el estado de mi pedido #4521 realizado el 15 de mayo.',
    justificacion:'El caso está siendo revisado por el equipo de soporte logístico.',
    tieneAnexo:true
  },
  {
    id:'PQRS-2026-00002',tipo:'Reclamo',estado:'Resuelto',fecha:'10/05/2026',
    comentarios:'Producto defectuoso recibido en mal estado. Solicito reposición.',
    justificacion:'Se procesó el reemplazo del producto. Será enviado en 2-3 días hábiles.',
    tieneAnexo:true
  },
];
const badgeCls={Nuevo:'nuevo','En proceso':'proceso',Resuelto:'resuelto',Rechazado:'rechazado'};

function filtrar(){
  const q=document.getElementById('buscar').value.toLowerCase();
  // RF-003: filtro solo por número de radicado
  const res=radicados.filter(r=>!q||r.id.toLowerCase().includes(q));
  renderizar(res, q);
}

function renderizar(lista, query){
  const c=document.getElementById('lista-radicados');
  if(!lista.length){
    // RF-003 E1 y A1
    c.innerHTML=`<div class="no-results">${
      query
        ? 'No se encontraron radicados con ese número.'
        : 'Aún no tienes PQRS radicadas. Toca "Nueva PQRS" para crear una.'
    }</div>`;
    return;
  }
  c.innerHTML=lista.map(r=>`
    <div class="card">
      <div class="card-header">
        <h3>${r.id}</h3>
        <span class="badge ${badgeCls[r.estado]}">${r.estado}</span>
      </div>
      <div class="card-meta">📋 <strong>${r.tipo}</strong> &nbsp;|&nbsp; 📅 ${r.fecha}</div>
      <div class="card-detalle">
        <p><strong>Descripción:</strong> ${r.comentarios}</p>
        ${r.justificacion?`<div class="just"><strong>Respuesta del gestor:</strong> ${r.justificacion}</div>`:''}
        ${r.tieneAnexo?`<p style="margin-top:8px">📎 <em>Tiene documento adjunto</em></p>`:''}
      </div>
    </div>
  `).join('');
}

filtrar();
</script>
</body>
</html>
