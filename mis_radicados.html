
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Radicados</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:0;
}
header{
    background:#1f4e79;
    color:white;
    padding:15px;
    text-align:center;
}
.container{
    width:90%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#163b5c;
}
.card{
    border:1px solid #ddd;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}
.estado{
    font-weight:bold;
}
.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
</style>
</head>
<body>
<header><h1>Mis Radicados</h1></header>

<div class="container">

<input type="text" placeholder="Buscar por número radicado">

<div class="card">
<h3>Radicado #2026-001</h3>
<p>Tipo: Petición</p>
<p class="estado">Estado: En proceso</p>
<a href="detalle_radicado.html"><button>Ver detalle</button></a>
</div>

<div class="card">
<h3>Radicado #2026-002</h3>
<p>Tipo: Reclamo</p>
<p class="estado">Estado: Resuelto</p>
<a href="detalle_radicado.html"><button>Ver detalle</button></a>
</div>

</div>
</body>
</html>
